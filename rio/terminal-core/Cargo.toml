[package]
name = "terminal-core"
version = "0.1.0"
edition = "2021"
description = "Terminal state machine core — grid, parser, snapshot (no GPU deps)"

[lib]
path = "src/lib.rs"

[dependencies]
# ANSI parser
copa = { workspace = true }
rio-proc-macros = { workspace = true }

# Data structures
bitflags = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
parking_lot = { workspace = true }
unicode-width = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }

# Additional
regex-automata = "0.4.9"
cursor-icon = { version = "1.1.0", default-features = false }
simdutf8 = { version = "0.1.5", default-features = false }
memchr = { version = "2.7.4", default-features = false }
rustc-hash = { workspace = true }
url = { workspace = true }

[features]
default = []
# Enable image_rs support for GraphicData::from_dynamic_image / resized
image = ["dep:image_rs"]

[dependencies.image_rs]
workspace = true
optional = true
