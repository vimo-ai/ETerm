[package]
name = "render-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared rendering infrastructure for sugarloaf-ffi (macOS) and sugarloaf-ffi-ios"

[dependencies]
sugarloaf = { path = "../sugarloaf", default-features = false, features = ["render"] }
parking_lot = { workspace = true }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "0.93.1", features = ["metal", "textlayout"] }

[target.'cfg(target_os = "ios")'.dependencies]
skia-safe = { version = "0.93.1", features = ["metal", "textlayout"] }
