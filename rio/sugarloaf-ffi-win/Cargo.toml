[package]
name = "sugarloaf-ffi-win"
version = "0.1.0"
edition = "2021"
description = "Windows FFI layer for ETerm terminal (ConPTY-based)"

[lib]
crate-type = ["cdylib"]

[dependencies]
teletypewriter = { path = "../teletypewriter" }
sugarloaf = { path = "../sugarloaf", default-features = false, features = ["render"] }
raw-window-handle = { version = "0.6.2", features = ["std"] }
libc = "0.2.174"
tracing = "0.1"
